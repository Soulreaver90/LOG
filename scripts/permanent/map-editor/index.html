<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOG Map Editor</title>
<!-- An inline icon, so the browser does not ask for a favicon.ico that is not there and log a 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2315151a'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23f0a860'/%3E%3Crect x='9' y='2' width='5' height='5' fill='%237fc08a'/%3E%3Crect x='2' y='9' width='5' height='5' fill='%237fc08a'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23f0a860'/%3E%3C/svg%3E">
<link rel="stylesheet" href="editor/style.css">
<!--
  Run it with: py -3.14 -P scripts\permanent\map-editor\serve.py
  A page on file:// cannot fetch its own assets, and the ROM reads belong in Python, so this page
  needs serve.py. It composes maps and nothing else: Python owns the ROM at both ends.
-->
</head>
<body>

<header>
  <h1>LOG Map Editor</h1>
  <div class="sep"></div>

  <label for="mapsel">Game map</label>
  <select id="mapsel"></select>
  <button id="open" class="go">Open a copy</button>

  <div class="sep"></div>

  <label for="bw">New blank</label>
  <input id="bw" type="number" min="1" max="8" value="4"
         title="Blocks across, 256 px each. 8 is the cap: the collision grid is 256 cells of 8 px, so right click can never paint past 2048 px.">
  <input id="bh" type="number" min="1" max="8" value="4"
         title="Blocks down, 256 px each. 8 is the cap: the collision grid is 256 cells of 8 px, so right click can never paint past 2048 px.">
  <button id="new" class="go ghost">Start</button>

  <div class="sep"></div>

  <label for="savedsel">Saved maps</label>
  <select id="savedsel"></select>
  <button id="openSaved" class="go ghost">Open</button>
  <input id="savename" placeholder="name this map" title="The map is saved to map-editor\maps\.">
  <button id="save" class="go">Save</button>

  <div id="title">nothing open</div>
  <!-- Unsaved state must be visible without reading the status line, which the next message
       overwrites. This marker stays up until a Save. -->
  <div id="dirty" class="marker"></div>
</header>

<!--
  The offer, shown only when an autosave is newer than the saved map of the same name. It is a bar
  of its own and not a status message, because status() is replaced by the next thing that happens
  and this question must wait for an answer.
-->
<div id="restore" class="restorebar" hidden>
  <span id="restore-text"></span>
  <select id="restoresel"></select>
  <button id="restore-go" class="go">Restore it</button>
  <button id="restore-no" class="go ghost">Leave it</button>
</div>

<div class="app">

  <!-- ===== left: the tiles ===== -->
  <section class="side">
    <div class="grouphead">This map's tiles <span id="palette-count">0 loaded</span></div>
    <div id="palette" class="tiles"></div>

    <div class="grouphead">The whole pool</div>
    <select id="chunksel"></select>
    <div id="pool" class="tiles"></div>

    <div class="grouphead">Stamps <span id="stamp-count"></span></div>
    <div id="stamps" class="tiles"></div>
  </section>

  <!-- ===== centre: the map ===== -->
  <section class="stage">
    <div class="bar" id="tools">
      <button class="tool" data-tool="tile" title="Paint the brush as you drag.">Tile</button>
      <button class="tool" data-tool="fill"
              title="Click to flood the ground you click. Drag to fill a box. The brush repeats.">Fill</button>
      <button class="tool" data-tool="stamp" title="Drop the chosen stamp, with its collision.">Stamp</button>
      <button class="tool" data-tool="grab"
              title="Drag a box over art you like. It becomes a stamp you can place anywhere.">Grab</button>

      <label for="size">Size</label>
      <select id="size"></select>
      <button id="erase" class="chip" title="Paint the empty tile, which rubs art out.">Eraser</button>

      <div class="sep"></div>
      <button id="undo" class="chip" title="Ctrl+Z">Undo</button>
      <button id="redo" class="chip" title="Ctrl+Y">Redo</button>
      <span id="brushnote"></span>
    </div>

    <div class="bar" id="toolbar">
      <label for="collmode">Right drag</label>
      <select id="collmode">
        <option value="wall">paints solid</option>
        <option value="floor">paints walkable</option>
      </select>
      <button id="floorall" class="chip" title="Open every cell inside the world in one step.">Fill walkable</button>
      <button id="wallall" class="chip" title="Close every cell in one step.">Fill solid</button>
      <label class="chip"><input type="checkbox" id="showcoll" checked> Show collision</label>

      <div class="sep"></div>
      <label for="stampname">Grab name</label>
      <input id="stampname" placeholder="boulder">
      <!--
        These three name LAYERS, not kinds of thing. The game splits one picture across layers, so
        a grab of one layer comes back with a hole wherever the art sat on another. The option text
        names the selected layer at run time, in panes.js, because which layer it means changes.
      -->
      <select id="grablayers"
              title="Every layer but this one leaves the layer you are painting on behind, so a boulder arrives without a square of its own map's ground. This layer only takes that one layer, which is the patch you fill a field with. Every layer copies the piece of map whole, holes and all, and is the setting that never loses art.">
        <option value="scenery">every layer but this one</option>
        <option value="ground">this layer only</option>
        <option value="all">every layer</option>
      </select>
      <select id="grabcoll"
              title="A rock wants its collision, so the player walks around it. A patch of ground or a piece of scenery wants none: a stamp writes a wall into every cell the grab found solid, including the cells where it draws nothing.">
        <option value="take">with its collision</option>
        <option value="none">art only, no collision</option>
      </select>

      <div class="sep"></div>
      <label for="zoom">Zoom</label>
      <input id="zoom" type="range" min="1" max="4" step="1" value="1">
      <span id="zoomnote">1x</span>
      <span id="where">cell -, -</span>
    </div>

    <div class="viewport">
      <!-- One stack: the map, and an overlay for the collision tint, the brush ghost and the box
           being dragged. A second canvas, so a hover never recomposites the whole map. -->
      <div class="stack">
        <canvas id="map" width="16" height="16"></canvas>
        <canvas id="overlay" width="16" height="16"></canvas>
      </div>
    </div>
    <footer><span id="status" class="info">loading ...</span></footer>
  </section>

  <!-- ===== right: layers, counts, properties ===== -->
  <section class="insp">
    <div class="grouphead">Tiles loaded</div>
    <div id="tilecount" class="big">0 / <span id="budget">896</span></div>
    <div id="tilesplit">nothing open</div>

    <div class="grouphead">Layers</div>
    <div id="layers"></div>

    <div class="grouphead">Map</div>
    <dl id="facts" class="facts"></dl>

    <div class="grouphead">Notes <span id="problems-head"></span></div>
    <ul id="problems"></ul>

    <!--
      The play-scale truth panel. It exists because the plateau rim was drawn correctly and could
      never be seen: that map carried a camera limit of 449 on a 1024 px world, so the camera
      stopped at pixel 687 and the rest was an invisible wall. Nothing shades until truth.js has
      checked its own rule against map_file.py.
    -->
    <div id="panels">
      <div class="grouphead">What the camera reaches <span id="truth-pin"></span></div>
      <div id="truth-lost" class="hint"></div>
      <dl id="truth-facts" class="facts"></dl>
      <label class="chip wide"><input type="checkbox" id="truth-shade" checked>
        Shade what the camera can never show</label>
      <label class="chip wide"><input type="checkbox" id="truth-box" checked>
        Show the 240 x 160 screen box</label>
      <label class="chip wide" title="The middle button always drags the box. Tick this to drag it with the left button, which paints nothing while it is on.">
        <input type="checkbox" id="truth-move"> Drag the box with the left button</label>
      <label class="worldrow" for="truth-w">World
        <input id="truth-w" type="number" min="240" step="8"
               title="The world is what the camera scrolls over, and it is NOT the block grid. The map carries world - 239 and world - 159 as its camera words.">
        <span>x</span>
        <input id="truth-h" type="number" min="160" step="8"
               title="The world is what the camera scrolls over, and it is NOT the block grid. The map carries world - 239 and world - 159 as its camera words.">
        <span>px</span>
      </label>
      <div id="truth-note" class="hint"></div>
    </div>
  </section>

</div>

<!--
  A classic script, on purpose, and before the module. On file:// Chrome blocks the module import
  as a cross origin request from origin null, and the whole module never runs, so a .catch inside
  it cannot report anything. The page would sit on "loading ..." for ever. This runs either way and
  says what to type instead.
-->
<script>
  // Not `status`: a global `var status` writes window.status, which coerces to a string in silence.
  if (location.protocol === "file:") {
    const line = document.getElementById("status");
    line.className = "bad";
    line.textContent = "This page needs its server. Run: py -3.14 -P "
      + "C:\\Users\\josephgonzalez\\Documents\\Projects\\Workspace\\LOG"
      + "\\scripts\\permanent\\map-editor\\serve.py";
  }
</script>
<script type="module">
  import { start } from "./editor/panes.js";
  start().catch((problem) => {
    document.getElementById("status").className = "bad";
    document.getElementById("status").textContent = `${problem}`;
  });
</script>
</body>
</html>
